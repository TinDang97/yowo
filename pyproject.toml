[project]
name = "yowo"
version = "2.4.0"
description = "Production YOLO inference and export library for edge and cloud deployment"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [{ name = "Tin Dang", email = "rainstone1029x@gmail.com" }]
keywords = ["yolo", "inference", "edge", "tensorrt", "onnx", "openvino"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
pytorch = ["torch>=2.0"]
export = ["torch>=2.0", "onnx>=1.12,<2.0", "onnxslim>=0.1"]
onnx = ["onnxruntime>=1.17"]
onnx-gpu = [
    "onnxruntime-gpu>=1.17,<1.20; python_version < '3.10'",
    "onnxruntime-gpu>=1.17; python_version >= '3.10'",
]
openvino = ["openvino>=2024.0"]
coreml = ["coremltools>=7.0"]
tracking = ["scipy>=1.11; python_version >= '3.9'"]
chromadb = [
    "chromadb>=0.5.0",
]
benchmark = ["pycocotools>=2.0.4", "rich>=13.0"]
all = ["yowo[pytorch,export,onnx-gpu,openvino,coreml,tracking,chromadb,benchmark]"]
# TensorRT requires manual installation on Linux+NVIDIA GPU:
# pip install tensorrt>=10.0 --extra-index-url https://pypi.nvidia.com
# Jetson (aarch64) uses NVIDIA's custom onnxruntime-gpu wheel:
# pip install onnxruntime-gpu --extra-index-url https://elinux.org/Jetson_Zoo

[project.scripts]
yowo = "yowo.cli._main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.3",
    "ruff==0.9.10",
    "pyright>=1.1",
    "pre-commit>=3.8",
    "torch>=2.0",
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.85",
    # onnxruntime >=1.20 drops Python 3.8 wheels; >=1.24 drops cp310 wheels
    "onnxruntime>=1.17,<1.20; python_version < '3.11'",
    "onnxruntime>=1.17; python_version >= '3.11'",
    "setuptools>=82.0.0",
    "onnxscript>=0.6.2; python_version >= '3.10'",
    "ultralytics>=8.4.21; python_version >= '3.11'",
    "pycocotools>=2.0.4",
    "rich>=13.0",
]

[tool.uv]
environments = [
    "python_version >= '3.9'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yowo"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]
reportMissingModuleSource = false
reportMissingImports = false
# Suppress unknowns from untyped external packages (pynvml, onnxruntime, openvino, tqdm)
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (require GPU, large models)",
    "integration: marks tests that need full hardware setup",
]

# ---------------------------------------------------------------------------
# Semantic Release (python-semantic-release)
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "uv build"
dist_path = "dist/"
upload_to_vcs_release = true
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]\n\nauthor: Tin Dang"

[tool.semantic_release.commit_parser_options]
# Conventional Commits → SemVer mapping
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "chore", "ci", "build", "style", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.changelog]
template_dir = ".github/templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "chore\\(release\\):",
    "Merge pull request",
    "Merge branch",
]

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
