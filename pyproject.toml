[project]
name = "yowo"
version = "0.1.0"
description = "Production YOLO inference and export library for edge and cloud deployment"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Tin Dang", email = "rainstone1029x@gmail.com" }]
keywords = ["yolo", "inference", "edge", "tensorrt", "onnx", "openvino"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "ultralytics>=8.3",
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
onnx-gpu = ["onnxruntime-gpu>=1.17"]
openvino = ["openvino>=2024.0"]
all = ["yowo[onnx-gpu,openvino]"]
# TensorRT requires manual installation on Linux+NVIDIA GPU:
# pip install tensorrt>=10.0 --extra-index-url https://pypi.nvidia.com

[project.scripts]
yowo = "yowo.cli._main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "pyright>=1.1",
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.85",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yowo"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]
reportMissingModuleSource = false
reportMissingImports = false
# Suppress unknowns from untyped external packages (pynvml, onnxruntime, openvino, tqdm)
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (require GPU, large models)",
    "integration: marks tests that need full hardware setup",
]
