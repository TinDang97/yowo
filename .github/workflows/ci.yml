# Pre-merge quality gate.
#
# CONTRACT (frozen by ADD task `pr-ci-gate` — see .add/tasks/pr-ci-gate.md):
#
#   * Job ids here are a frozen set. Six later tasks append a job to this file:
#     sdist-manifest, pypi-trusted-publish, arch-equivalence-in-ci,
#     integration-tier-revival, coverage-floor, ci-matrix.
#   * APPEND a new job id. Never rename, reuse, or restructure an existing one —
#     a reused id silently changes what an already-configured required status
#     check asserts (A11).
#   * When you add a job, add its id to FROZEN_JOB_IDS in
#     tests/unit/test_ci_contract.py in the SAME commit. That assertion exists so
#     an append is a deliberate edit rather than a silent drift.
#   * Do not add `needs:` between appended jobs unless your task declares the
#     dependency — the appenders are independent by default (A14).
#   * The steps below must stay identical to release.yml's `quality` job. A PR
#     must not be able to pass a weaker gate than the one `main` runs
#     (R:DIVERGENCE, asserted by test_ci_runs_the_same_four_quality_commands_as_release).
#
# The required status check configured on `main` is the job NAME, "Quality Gate".
# See docs/ci-required-checks.md before changing it.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/ tests/ --quiet

      - name: Format check
        run: uv run ruff format src/ tests/ --check --quiet

      - name: Type check
        run: uv run pyright src/yowo/

      - name: Unit tests
        run: uv run pytest tests/unit/ -x -q --tb=short --timeout=60
        timeout-minutes: 15

  # Appended by ADD task `sdist-manifest`. Independent of `quality` by contract (A14).
  # Not (yet) a required status check — promoting it is `pypi-trusted-publish`'s call (A7).
  sdist:
    name: Source Distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Verify the built distributions contain only what we publish
        run: python scripts/verify_sdist_contents.py
        timeout-minutes: 10

  # Appended by ADD task `reproducible-sdist`. Independent of the other jobs.
  # Proves a published artifact can be shown to match this source.
  reproducible:
    name: Reproducible Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build twice and compare digests
        run: python scripts/verify_reproducible_build.py
        timeout-minutes: 15

  # Appended by ADD task `ci-weight-fixture`. Proves CI can obtain a real,
  # digest-verified weight without a per-job download and without the weight
  # entering the repository. Which integration tests actually run, and when, is
  # `integration-tier-revival`'s call — not this job's.
  weights:
    name: Weight Fixture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      # Keyed on the PINNED DIGESTS, not on a model name. A name-keyed cache
      # would serve the old bytes forever after a re-pin, defeating the whole
      # point of weight-integrity.
      - name: Restore the verified weight store
        uses: actions/cache@v4
        with:
          # Both stores, named explicitly rather than cached as one opaque
          # parent: a reader should be able to tell from the workflow what is
          # kept between runs and why.
          path: |
            ~/.cache/yowo/weights
            ~/.cache/yowo/test-assets
          key: yowo-weights-sha256-${{ hashFiles('src/yowo/models/_registry.py', 'tests/support/datasets.py') }}

      - name: CI can obtain a digest-verified weight
        env:
          CI: "true"
        run: uv run pytest tests/integration/test_engine_integration.py -q --tb=short
        timeout-minutes: 15

  # Appended by ADD task `real-backend-smoke`. A seventh appender the pr-ci-gate
  # contract did not foresee, added under its APPEND rule rather than by widening
  # an existing job: the `weights` job above states that which integration tests
  # run is `integration-tier-revival`'s call, and that task is an unauthored
  # scaffold in a later milestone. m2 box 7 cannot wait behind it.
  #
  # What this job asserts that `weights` does not: the backend executed is the one
  # the test ASKED for rather than whatever survived a fallback, the input is a
  # real image rather than a black frame, and the assertions are ones a backend
  # returning nothing would fail.
  backend-smoke:
    name: Real Backend Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      # Same key as the `weights` job: both read the same two stores, so a hit
      # here is a hit there. Keyed on the pinned digests, not on a model name.
      - name: Restore the verified weight store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yowo/weights
            ~/.cache/yowo/test-assets
          key: yowo-weights-sha256-${{ hashFiles('src/yowo/models/_registry.py', 'tests/support/datasets.py') }}

      # CI: "true" is what turns a missing weight, image or torch from a green
      # skip into a failure. Without it this job can report success having
      # executed no backend at all — the defect this task was written to close.
      - name: A real backend executes on a real image
        env:
          CI: "true"
        run: uv run pytest tests/integration/test_real_backend_smoke.py -q --tb=short
        timeout-minutes: 15

  # Appended by ADD task `backend-conformance-suite` under the pr-ci-gate APPEND
  # rule. An eighth appender, added as a new job rather than by widening
  # `backend-smoke`: that job proves ONE backend executes at all, this one proves
  # three agree. Merging them would make a conformance failure read as a smoke
  # failure, and they have different owners.
  #
  # `--extra openvino` is what makes the roster's claim true. Measured
  # 2026-09-13: openvino installs on ubuntu CPU (openvino==2026.3.1, 2
  # packages), so listing OpenVINO unverified would record a choice as a
  # limitation. It is also the backend this task found to be completely dead —
  # twice — so it is the one most worth re-proving on every PR.
  conformance:
    name: Backend Conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev --extra openvino

      # Same key as `weights` and `backend-smoke`: all three read the same two
      # stores, so a hit in one is a hit in the others.
      - name: Restore the verified weight store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yowo/weights
            ~/.cache/yowo/test-assets
          key: yowo-weights-sha256-${{ hashFiles('src/yowo/models/_registry.py', 'tests/support/datasets.py') }}

      # CI: "true" turns a missing weight or image from a green skip into a
      # failure. Without it this job can report success having executed nothing.
      - name: Three backends agree, or the difference is reported
        env:
          CI: "true"
        run: uv run pytest tests/integration/test_backend_conformance.py -q --tb=short
        timeout-minutes: 20

      # The default export invocation wrote zero files until 2026-09-13 and no
      # job would have noticed: every export check in the unit suite mocks the
      # exporter. This step runs a REAL export at the DEFAULT precision and
      # loads the result back, which is the only thing that binds that path.
      - name: The default export precision produces a loadable artifact
        env:
          CI: "true"
        run: uv run pytest tests/integration/test_export_default_precision.py -q --tb=short
        timeout-minutes: 20

      # INT8 shipped an artifact that loaded, inferred, returned a well-formed
      # (1,84,8400) and detected NOTHING — every class row exactly zero while the
      # box rows still decoded, which is why it looked healthy. No unit check
      # could catch it: they all mock the quantizer. This runs a real export and
      # a real quantization and asserts the artifact still detects.
      - name: An INT8 artifact still detects what its FP32 source detects
        env:
          CI: "true"
        run: uv run pytest tests/integration/test_int8_parity.py -q --tb=short
        timeout-minutes: 20

  # COCO val2017 is 1.07 GB from a third party, so it is fetched under a SHA-256
  # pin, over the path-style S3 URL: https://images.cocodataset.org/ is fronted
  # by a certificate for s3.amazonaws.com and fails TLS verification, which is
  # why most recipes for this dataset quietly fall back to plain HTTP.
  accuracy-dataset:
    name: Accuracy Dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev --extra benchmark

      # Keyed on the PINNED DIGESTS and the subset manifest, so a re-pin or a
      # re-selection invalidates it. A name-keyed cache would serve the old
      # 1.07 GB forever. The store holds the extracted tree only — the archives
      # are deleted after extraction, deliberately, so this does not blow the
      # 10 GB per-repo budget the weight cache also draws on.
      - name: Restore the COCO val2017 tree
        uses: actions/cache@v4
        with:
          path: ~/.cache/yowo/datasets/coco-val2017
          key: yowo-coco-val2017-${{ hashFiles('tests/support/datasets.py', 'tests/fixtures/coco_val2017_subset500.tsv') }}

      # CI: "true" turns a missing dataset from a green skip into a failure.
      # timeout-minutes MUST stay above the 1800s per-attempt fetch deadline
      # (CI_JOB_TIMEOUT_MINUTES_REQUIRED = 45, asserted by a unit check): below
      # it GitHub cancels the job first and the contributor gets a bare
      # cancellation carrying none of the guidance the failure message holds.
      - name: The pinned subset describes real COCO
        env:
          CI: "true"
        run: uv run pytest tests/integration/test_coco_dataset.py -q --tb=short
        timeout-minutes: 45

  # Appended by ADD task `map-regression-gate`. A separate job rather than a
  # step on `accuracy-dataset`, for two reasons: it needs the weight store as
  # well as the image store, and branch protection binds a published check
  # NAME — a gate folded into another job cannot be required on its own.
  #
  # What this job asserts that `accuracy-dataset` does not: the model still
  # detects. `accuracy-dataset` proves the 500 pinned images are the real COCO
  # ones; nothing there runs a model over them.
  map-gate:
    name: mAP Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev --extra benchmark

      # Same key as `accuracy-dataset`, so the two jobs share one 1.07 GB
      # entry rather than each storing their own.
      - name: Restore the COCO val2017 tree
        uses: actions/cache@v4
        with:
          path: ~/.cache/yowo/datasets/coco-val2017
          key: yowo-coco-val2017-${{ hashFiles('tests/support/datasets.py', 'tests/fixtures/coco_val2017_subset500.tsv') }}

      # Same key as `weights`. The gate measures with the digest-verified
      # weight the baseline pins; an unverified download would measure a
      # different file and the band would be defending nothing.
      - name: Restore the verified weight store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yowo/weights
            ~/.cache/yowo/test-assets
          key: yowo-weights-sha256-${{ hashFiles('src/yowo/models/_registry.py', 'tests/support/datasets.py') }}

      # CI: "true" turns a missing dataset or weight from a green skip into a
      # failure. 500 images infer in ~21s on CPU; the ceiling is set by the
      # cold-cache fetch of both stores, and MUST stay at the value
      # MAP_GATE_TIMEOUT_MINUTES_REQUIRED asserts.
      - name: yolo11n still scores what the baseline records
        env:
          CI: "true"
        run: uv run pytest tests/integration/test_map_regression.py -q --tb=short
        timeout-minutes: 45
