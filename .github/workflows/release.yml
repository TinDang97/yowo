name: Release

on:
  push:
    branches: [main]

# Least privilege at the workflow level; jobs that need more ask for it.
# `quality` and `sdist` only read the repo. Only `release` writes (tag + bump
# commit), and only `publish` needs the OIDC token.
permissions:
  contents: read

# Every action below is pinned to an exact version, not a floating major tag
# (m1 leg iii, amended). A floating `@v4` can point at different code tomorrow,
# and every action here runs with this workflow's write permissions.
# Residual risk, accepted knowingly: a tag is mutable, so a compromised upstream
# could republish the same version. Revisit if Dependabot for actions lands.

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3.2.4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/ tests/ --quiet

      - name: Format check
        run: uv run ruff format src/ tests/ --check --quiet

      - name: Type check
        run: uv run pyright src/yowo/

      - name: Unit tests
        run: uv run pytest tests/unit/ -x -q --tb=short --timeout=60
        timeout-minutes: 15

  # R:UNGATED — ci.yml's sdist job only runs on pull_request, so the push-to-main
  # path needs its own. Nothing publishes unless this and `quality` both pass.
  sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3.2.4

      - name: Verify the built distributions contain only what we publish
        run: python scripts/verify_sdist_contents.py
        timeout-minutes: 10

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [quality, sdist]
    concurrency: release
    environment: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}

    steps:
      # Minted FIRST (A9): an App token lasts one hour, so minting it before a
      # long job would risk expiry mid-release. No fallback to GITHUB_TOKEN — that
      # token cannot push to a protected branch, which is the GH006 failure this
      # replaces, and a silent fallback would look like a new bug (E2).
      - name: Mint a scoped App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Checkout must use the App token too (A8): a checkout under GITHUB_TOKEN
      # leaves a remote the App token cannot push to.
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3.2.4

      # `version` bumps, commits, tags and runs build_command (`uv build`) into
      # dist/. `publish` uploads that to the GitHub Release. PyPI comes after,
      # in a separate job, so a PyPI failure leaves a valid tag to retry from (A3).
      - name: Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uv tool run --from python-semantic-release==10.6.2 semantic-release version
          uv tool run --from python-semantic-release==10.6.2 semantic-release publish

          # `released` must be written by hand. python-semantic-release only sets
          # a step output when used as a GitHub Action; invoked as a plain command
          # it sets nothing, and an unset output would silently skip the PyPI
          # publish while every job stayed green. build_command (`uv build`) runs
          # only when a release actually happens, so a populated dist/ is the
          # signal. Asserted by test_release_job_writes_the_released_output.
          if [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new version to release."
          fi

      - name: Keep the built distributions for the publish job
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # M1 — uploads what the gates passed. This job never builds; it downloads the
  # artifact `release` produced, so what reaches PyPI is byte-identical to what
  # was tagged and attached to the GitHub Release.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [quality, sdist, release]
    if: needs.release.outputs.released == 'true'
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Fetch the distributions built by Semantic Release
        uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/

      # M2 — OIDC. No `password:` input, because no PyPI credential exists.
      # The trusted publisher on PyPI is bound to this repo, this workflow file
      # and the `release` environment, so nothing else can mint a token (A1).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # E1 — a re-run on an already-published version is a no-op. A red job
          # on a successful release is how the last five failures went unread.
          skip-existing: true
