name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/ tests/ --quiet

      - name: Format check
        run: uv run ruff format src/ tests/ --check --quiet

      - name: Type check
        run: uv run pyright src/yowo/

      - name: Unit tests
        run: uv run pytest tests/unit/ -x -q --tb=short
        timeout-minutes: 10

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [quality]
    concurrency: release
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv tool run --from python-semantic-release semantic-release version
          uv tool run --from python-semantic-release semantic-release publish
